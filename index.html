const CONFIGURED = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith('PEGAR');
let app,auth,db;
if(CONFIGURED){app=initializeApp(FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app)}

const ST={user:null,perfil:null,cfg:null,reportes:[],anioCargado:null,cargando:false,resumen:[],resAnio:null};
const isAdmin=()=>ST.perfil&&ST.perfil.rol==='admin';
const isGestor=()=>ST.perfil&&(ST.perfil.rol==='admin'||ST.perfil.rol==='gestor');
const todos=()=>ST.perfil&&(isAdmin()||(ST.perfil.centros||[]).includes('*'));
const misCentros=()=>todos()?ST.cfg.centros.map(c=>c.c):(ST.perfil.centros||[]);
const puedeEditar=c=>isAdmin()||(ST.perfil&&ST.perfil.rol==='gestor'&&(todos()||(ST.perfil.centros||[]).includes(c)));
const cen=c=>(ST.cfg&&ST.cfg.centros.find(x=>x.c===c))||{c,n:c,e:'',t:0};
function estado(r){if(r.estado==='Cerrado'||r.estado==='Anulado')return r.estado;if(r.fCompromiso&&r.fCompromiso<today())return'Vencido';return r.estado}
const areasDe=cc=>{const a=cen(cc).areas;return(a&&a.length)?a:AREAS_DEF};
const pill=e=>`<span class="pill p-${e.split(' ')[0]}">${e}</span>`;
const M=()=>ST.cfg.metas, P=()=>ST.cfg.plazos;
function sem(v){if(v==null)return'#ccc';return v>=M().cierre?'var(--ok)':v>=70?'var(--warn)':'var(--bad)'}

async function loadCfg(){if(ST.cfg)return ST.cfg;const s=await getDoc(doc(db,'config','general'));ST.cfg=s.exists()?{...CFG_DEF,...s.data()}:null;return ST.cfg}
async function ensureAuth(){if(auth.currentUser)return auth.currentUser;await signInAnonymously(auth);return auth.currentUser}
async function loadPerfil(u){
  if(!u||u.isAnonymous){ST.perfil=null;return}
  if(u.email&&u.email.toLowerCase()===String(SUPERADMIN).toLowerCase()){ST.perfil={rol:'admin',centros:['*'],nombre:u.email,activo:true,email:u.email};return}
  const s=await getDoc(doc(db,'usuarios',u.uid));ST.perfil=s.exists()&&s.data().activo!==false?s.data():null;
}
async function loadReportes(anio,force){
  if(!force&&ST.anioCargado===anio)return ST.reportes;
  ST.cargando=true;let out=[];
  if(todos()){const s=await getDocs(query(collection(db,'reportes'),where('anio','==',anio)));s.forEach(d=>out.push(d.data()))}
  else{const res=await Promise.all(misCentros().map(c=>getDocs(query(collection(db,'reportes'),where('centro','==',c),where('anio','==',anio)))));res.forEach(s=>s.forEach(d=>out.push(d.data())))}
  out.sort((a,b)=>(b.fecha+b.hora)<(a.fecha+a.hora)?-1:1);ST.reportes=out;ST.anioCargado=anio;ST.cargando=false;return out;
}
// Indicadores de los reportes ya archivados en cierres trimestrales (agregados por año/mes/centro)
async function loadResumen(anio,force){
  if(!force&&ST.resAnio===anio)return ST.resumen;
  const s=await getDocs(query(collection(db,'resumenes'),where('anios','array-contains',anio)));const rows=[];
  s.forEach(d=>(d.data().filas||[]).forEach(f=>{if(f.anio===anio)rows.push(f)}));ST.resumen=rows;ST.resAnio=anio;return rows;
}
function invalidar(){ST.anioCargado=null;ST.resAnio=null}

/* ===================== NAVEGACIÓN ===================== */
function nav(){
  const items=[];if(ST.perfil){items.push(['gestion','Gestión'],['dashboard','Dashboard']);if(isAdmin())items.push(['qr','Códigos QR'],['cierres','Cierres'],['config','Configuración'],['usuarios','Usuarios'])}
  const v=(location.hash.slice(1)||'').split('-')[0];
  $('#nav').innerHTML=items.map(([h,t])=>`<a href="#${h}" class="${v===h?'on':''}">${t}</a>`).join('')+
    (ST.perfil?`<span class="who">${esc(ST.perfil.nombre||ST.user.email)}</span><a id="salir">Salir</a>`:`<a href="#login" class="${v==='login'?'on':''}">Ingresar</a>`);
  const s=$('#salir');if(s)s.onclick=async()=>{await signOut(auth);ST.perfil=null;ST.reportes=[];ST.anioCargado=null;location.hash='#login'};
}
async function route(){
  $('#hTito').innerHTML=tito('inicio',44,'tito-h');
  if(!CONFIGURED){$('#main').innerHTML=`<div class="card center" style="max-width:560px;margin:30px auto">${tito('alerta',110)}<h2>Falta configurar Firebase</h2><p class="sub">Pega la configuración web del proyecto en <b>FIREBASE_CONFIG</b> dentro de index.html (ver README).</p></div>`;return}
  const h=location.hash.slice(1);let v=h||'',code='';
  if(h.startsWith('reportar-')){v='reportar';code=h.slice(9).toUpperCase()}
  document.body.classList.toggle('qrmode',!!code);
  $('#hsub').textContent='Actos y Condiciones Inseguras · Grupo ANAVA';
  try{
    if(v==='reportar'){await ensureAuth();await loadCfg();nav();return vReportar(code)}
    if(!ST.perfil){if(v&&v!=='login'){location.hash='#login';return}nav();return vLogin()}
    if(v===''||v==='login'){location.hash='#dashboard';return}
    if(!ST.cfg)await loadCfg();
    if(!ST.cfg){nav();return isAdmin()?vInit():($('#main').innerHTML=`<div class="card">El catálogo aún no está inicializado. Contacta a la administradora.</div>`)}
    if(['qr','config','usuarios','cierres'].includes(v)&&!isAdmin()){location.hash='#dashboard';return}
    nav();
    ({gestion:vGestion,dashboard:vDashboard,qr:vQR,config:vConfig,usuarios:vUsuarios,cierres:vCierres}[v]||vDashboard)();
  }catch(e){console.error(e);$('#main').innerHTML=`<div class="card center">${tito('alerta',90)}<h3>No se pudo cargar</h3><p class="sub">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">Reintentar</button></div>`}
}

/* ===================== LOGIN ===================== */
function vLogin(){
  $('#main').innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><div class="center">${tito('login',110)}</div>
   <h2 class="center">Ingreso gestores HSEQ</h2><p class="sub center">Para reportar un acto o condición insegura no necesitas cuenta: escanea el QR de tu centro.</p>
   <form id="fl"><label>Correo</label><input id="lE" type="email" required autocomplete="username"><label>Contraseña</label><input id="lP" type="password" required autocomplete="current-password">
   <button class="btn" style="width:100%;margin-top:14px" id="lB">Ingresar</button></form>
   <p class="center"><a href="#" id="lR" style="font-size:12px;color:var(--r2)">¿Olvidaste tu contraseña?</a></p></div>`;
  $('#fl').onsubmit=async e=>{e.preventDefault();$('#lB').disabled=true;
    try{const c=await signInWithEmailAndPassword(auth,$('#lE').value.trim(),$('#lP').value);await loadPerfil(c.user);
      if(!ST.perfil){await signOut(auth);toast('Tu usuario no está habilitado. Contacta a HSEQ corporativo');$('#lB').disabled=false;return}
      location.hash='#dashboard'}catch(err){toast(errMsg(err));$('#lB').disabled=false}};
  $('#lR').onclick=async e=>{e.preventDefault();const m=$('#lE').value.trim();if(!m)return toast('Escribe tu correo primero');
    try{await sendPasswordResetEmail(auth,m);toast('Te enviamos un correo para restablecer la contraseña')}catch(err){toast(errMsg(err))}};
}
function vInit(){
  $('#main').innerHTML=`<div class="card center" style="max-width:560px;margin:30px auto">${tito('inicio',110)}<h2>Bienvenida a TITO HSEQ · ACIS</h2>
   <p class="sub">Primer ingreso: crea el catálogo de empresas y centros de trabajo. Luego podrás ajustarlo en Configuración.</p><button class="btn" id="iB">Inicializar catálogo</button></div>`;
  $('#iB').onclick=async()=>{try{await setDoc(doc(db,'config','general'),CFG_DEF);ST.cfg=CFG_DEF;toast('Catálogo creado');location.hash='#config'}catch(e){toast(errMsg(e))}};
}

/* ===================== REPORTAR (QR) ===================== */
let form={};
function vReportar(code){
  if(!ST.cfg){$('#main').innerHTML=`<div class="card center">${tito('alerta',90)}<p>La app aún no está configurada. Avisa al equipo HSEQ.</p></div>`;return}
  const c=code?ST.cfg.centros.find(x=>x.c===code&&x.act):null;
  if(code&&!c){$('#main').innerHTML=`<div class="card center" style="max-width:520px;margin:20px auto">${tito('alerta',100)}<h3>Este código QR no está activo</h3><p class="sub">Avisa al HSEQ de tu centro. Código: ${esc(code)}</p></div>`;return}
  form={tipo:'',riesgo:'',vinculo:''};
  if(c)$('#hsub').textContent=`${c.n} · ${emp(c.e)}`;
  $('#main').innerHTML=`<div class="card" style="max-width:720px;margin:0 auto">
   <div class="hero">${tito('inicio',96)}<div><h2>Reporta un acto o condición insegura</h2><div class="bubble">¡Hola! Soy Tito. Cuéntame lo que viste: toma un minuto y puede ser anónimo. Reportar también es cuidarnos 🦺</div></div></div>
   <form id="frm">
    ${c?`<div class="kpi" style="border-top-color:var(--r1)"><div class="l">Centro de trabajo</div><div style="font-weight:800;font-size:16px">${esc(c.n)}</div><div class="s">${esc(emp(c.e))}</div></div>`
      :`<label>Centro de trabajo *</label><select id="fCentro" required><option value="">Selecciona…</option>${ST.cfg.centros.filter(x=>x.act).map(x=>`<option value="${x.c}">${esc(x.n)} — ${esc(emp(x.e))}</option>`).join('')}</select>`}
    <label>¿Qué vas a reportar? *</label>
    <div class="seg" id="segTipo"><button type="button" data-v="Acto">🧍 Acto inseguro<br><small style="font-weight:500">Algo que hace una persona</small></button><button type="button" data-v="Condición">⚠️ Condición insegura<br><small style="font-weight:500">Algo del lugar, equipo o entorno</small></button></div>
    <label>Categoría *</label><select id="fCat" required><option value="">Selecciona…</option>${CATS.map(x=>`<option>${x}</option>`).join('')}</select>
    <div class="hint" id="hCat"></div>
    <div class="row"><div><label>Lugar / área *</label><select id="fArea" required></select></div>
    <div><label id="lDet">Precisa el sitio (opcional)</label><input id="fDet" maxlength="80" placeholder="Ej.: Bodega 2, pasillo 4, muelle 3"></div></div>
    <label>Describe lo que viste *</label><textarea id="fDesc" required minlength="5" maxlength="2000" placeholder="¿Qué pasó o qué condición encontraste?"></textarea>
    <label>¿Qué tan peligroso es? *</label>
    <div class="opts" id="segRiesgo">${RIESGOS.map(r=>`<button type="button" data-v="${r.v}" class="opt"><div class="ot">${r.i} ${r.v}</div><div class="od">${r.d}</div><div class="oe">Ejemplos: ${r.e}</div></button>`).join('')}</div>
    <div class="hint">¿Dudas entre dos niveles? Elige el más alto. Si es <b>Alto</b>, además de reportar avisa de inmediato a tu supervisor o al HSEQ del centro.</div>
    <label>¿Se tomó alguna medida inmediata? (opcional)</label><input id="fMed" maxlength="300" placeholder="Ej.: Se aisló el área, se avisó al supervisor">
    <label>Foto (opcional)</label><input type="file" id="fFoto" accept="image/*" capture="environment">
    <label>¿Cuál es tu relación con ANAVA? (vínculo) *</label>
    <div class="hint" style="margin-top:0">Nos ayuda a saber quién reporta y a quién involucrar en la solución. No afecta tu anonimato.</div>
    <div class="opts" id="segVin">${VINCULOS.map(r=>`<button type="button" data-v="${r.v}" class="opt"><div class="ot">${r.i} ${r.v}</div><div class="od">${r.d}</div></button>`).join('')}</div>
    <label>Tu nombre (opcional)</label><input id="fRep" maxlength="80" placeholder="Déjalo vacío para que tu reporte sea anónimo">
    <div style="margin-top:18px"><button class="btn" id="fB" style="width:100%;padding:14px;font-size:15px">Enviar reporte</button></div>
   </form></div>`;
  const segs=(id,k)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{form[k]=b.dataset.v;$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  segs('#segTipo','tipo');segs('#segRiesgo','riesgo');segs('#segVin','vinculo');
  $('#fCat').onchange=()=>{const d=CAT_DESC[$('#fCat').value];$('#hCat').innerHTML=d?'ℹ️ '+esc(d):''};
  const fillAreas=cc=>{const as=cc?areasDe(cc):[];$('#fArea').innerHTML=`<option value="">${cc?'Selecciona…':'Primero elige el centro'}</option>`+as.map(a=>`<option>${esc(a)}</option>`).join('')+(cc?'<option value="Otro">Otro (descríbelo)</option>':'')};
  fillAreas(c?c.c:'');if(!c)$('#fCentro').onchange=()=>fillAreas($('#fCentro').value);
  $('#fArea').onchange=()=>{const o=$('#fArea').value==='Otro';$('#lDet').textContent=o?'¿Cuál lugar? *':'Precisa el sitio (opcional)';$('#fDet').required=o};
  $('#frm').onsubmit=async e=>{e.preventDefault();
    if(!form.tipo)return toast('Selecciona si es acto o condición');if(!form.riesgo)return toast('Selecciona el nivel de peligro');
    const cc=c?c.c:$('#fCentro').value;if(!cc)return toast('Selecciona el centro de trabajo');
    if(!$('#fArea').value)return toast('Selecciona el lugar o área');if($('#fArea').value==='Otro'&&!$('#fDet').value.trim())return toast('Escribe cuál es el lugar');
    if(!form.vinculo)return toast('Selecciona tu relación con ANAVA (vínculo)');
    const desc=$('#fDesc').value.trim();if(desc.length<5)return toast('Describe un poco más lo que viste');
    const area=($('#fArea').value==='Otro'?$('#fDet').value.trim():$('#fArea').value+($('#fDet').value.trim()?' — '+$('#fDet').value.trim():'')).slice(0,120);
    $('#fB').disabled=true;$('#fB').textContent='Enviando…';
    try{
      await ensureAuth();
      const f=today(),y=f.slice(0,4),now=new Date();const foto=await compress($('#fFoto').files[0]);
      const cx=cen(cc);let id='';
      await runTransaction(db,async tx=>{
        const cref=doc(db,'contadores',`${cc}-${y}`);const s=await tx.get(cref);const n=(s.exists()?s.data().n:0)+1;
        id=`ACIS-${cc}-${y}-${String(n).padStart(4,'0')}`;
        tx.set(cref,{n});
        tx.set(doc(db,'reportes',id),{id,seq:n,anio:y,mes:f.slice(5,7),fecha:f,hora:now.toTimeString().slice(0,5),centro:cc,empresa:cx.e||'',
          tipo:form.tipo,categoria:$('#fCat').value,riesgo:form.riesgo,area,descripcion:desc,medida:$('#fMed').value.trim(),
          reportante:$('#fRep').value.trim()||'Anónimo',vinculo:form.vinculo,tieneFoto:!!foto,tieneFotoCierre:false,
          responsable:cx.resp||'',fCompromiso:addDays(f,ST.cfg.plazos[form.riesgo]),accion:'',estado:'Abierto',fCierre:'',cierreDesc:'',verificado:'',eficaz:'',motivoAnula:'',
          hist:[{f,t:'Reporte recibido'+(code?' por QR':'')}],creado:serverTimestamp()});
        if(foto)tx.set(doc(db,'fotos',id+'_r'),{reporte:id,data:foto});
      });
      $('#main').innerHTML=`<div class="card center" style="max-width:520px;margin:0 auto;padding:30px 16px">${tito('gracias',130)}
        <h2>¡Gracias por reportar!</h2><div class="bubble">Con tu reporte evitamos que alguien se lastime. ¡Eres parte del ADN de la seguridad!</div>
        <div style="font-size:22px;font-weight:800;color:var(--r2);margin:8px 0">${id}</div>
        <p class="sub">Asignado a <b>${esc(cx.resp||'HSEQ')}</b> · fecha límite de gestión <b>${fmt(addDays(f,ST.cfg.plazos[form.riesgo]))}</b> (riesgo ${form.riesgo}).</p>
        <button class="btn" id="otro">Reportar otro</button></div>`;
      $('#otro').onclick=()=>vReportar(code);window.scrollTo(0,0);
    }catch(err){console.error(err);toast('No se pudo enviar: '+errMsg(err),4500);$('#fB').disabled=false;$('#fB').textContent='Enviar reporte'}
  };
}

/* ===================== GESTIÓN ===================== */
let gf={anio:today().slice(0,4),estado:'pend',empresa:'',centro:'',q:''};let gRows=[];
async function vGestion(force){
  $('#main').innerHTML=`<div class="loading">${tito('gestion',80)}<br>Cargando reportes…</div>`;
  await loadReportes(gf.anio,force);
  const o=(arr,sel)=>arr.map(([v,t])=>`<option value="${v}" ${v===sel?'selected':''}>${esc(t)}</option>`).join('');
  const cs=ST.cfg.centros.filter(c=>misCentros().includes(c.c)&&(!gf.empresa||c.e===gf.empresa));
  const anios=[];for(let y=+today().slice(0,4);y>=2026;y--)anios.push(String(y));
  const venc=ST.reportes.filter(r=>estado(r)==='Vencido').length;
  $('#main').innerHTML=`<div class="hero" style="margin-bottom:12px">${tito(venc?'alerta':'gestion',70)}<div><h2>Gestión y seguimiento</h2><p class="sub" style="margin:0">Asigna responsable, define la acción, controla el plazo y cierra con evidencia. Los reportes de trimestres ya cerrados están en los respaldos de Cierres. ${venc?`<b style="color:var(--bad)">Hay ${venc} reportes vencidos.</b>`:''}</p></div></div>
   <div class="card"><div class="filters">
    <div style="max-width:110px"><label>Año</label><select id="gA">${o(anios.map(a=>[a,a]),gf.anio)}</select></div>
    <div><label>Estado</label><select id="gE"><option value="">Todos</option>${o([['pend','Pendientes (no cerrados)'],['Abierto','Abierto'],['En gestión','En gestión'],['Vencido','Vencido'],['Cerrado','Cerrado'],['Anulado','Anulado']],gf.estado)}</select></div>
    ${todos()?`<div><label>Empresa</label><select id="gEm"><option value="">Todas</option>${o(EMPRESAS.map(e=>[e.c,e.n]),gf.empresa)}</select></div>`:''}
    <div><label>Centro</label><select id="gC"><option value="">Todos</option>${o(cs.map(c=>[c.c,c.n]),gf.centro)}</select></div>
    <div style="flex:2"><label>Buscar</label><input id="gQ" value="${esc(gf.q)}" placeholder="ID, descripción, responsable…"></div>
    <div style="flex:0"><button class="btn sec sm" id="gR" title="Actualizar">↻</button></div>
    <div style="flex:0"><button class="btn sm" id="gX">Exportar Excel</button></div>
   </div><div class="tw" id="gT"></div></div>`;
  const re=()=>{gf.estado=$('#gE').value;gf.centro=$('#gC').value;gf.q=$('#gQ').value;tabla()};
  $('#gE').onchange=re;$('#gC').onchange=re;$('#gQ').oninput=re;
  $('#gA').onchange=()=>{gf.anio=$('#gA').value;vGestion()};$('#gR').onclick=()=>vGestion(true);
  if($('#gEm'))$('#gEm').onchange=()=>{gf.empresa=$('#gEm').value;gf.centro='';vGestion()};
  $('#gX').onclick=exportar;
  tabla();
}
function tabla(){
  const q=gf.q.toLowerCase(),hoy=today();
  gRows=ST.reportes.filter(r=>{const e=estado(r);
    if(gf.estado==='pend'?(e==='Cerrado'||e==='Anulado'):gf.estado&&e!==gf.estado)return false;
    if(gf.empresa&&r.empresa!==gf.empresa)return false;if(gf.centro&&r.centro!==gf.centro)return false;
    if(q&&!(r.id+' '+r.descripcion+' '+r.responsable+' '+r.area+' '+r.categoria).toLowerCase().includes(q))return false;return true});
  const lim=gRows.slice(0,400);
  $('#gT').innerHTML=gRows.length?`<div class="counter" style="margin-bottom:6px">${gRows.length} reportes${gRows.length>400?' · mostrando 400 (usa filtros o exporta)':''}</div>
  <table><thead><tr><th>ID</th><th>Fecha</th><th>Centro</th><th>Tipo</th><th>Categoría</th><th>Riesgo</th><th>Responsable</th><th>Compromiso</th><th>Días</th><th>Estado</th></tr></thead><tbody>
  ${lim.map(r=>{const e=estado(r);let d='';if(e==='Cerrado')d=`<span class="counter">${diff(r.fecha,r.fCierre)} d en cerrar</span>`;
    else if(e==='Vencido')d=`<span class="counter bad">${diff(r.fCompromiso,hoy)} d vencido</span>`;else if(e!=='Anulado')d=`<span class="counter">${diff(r.fecha,hoy)} d abierto</span>`;
    return`<tr class="click" data-id="${r.id}"><td><b>${r.id}</b>${r.tieneFoto?' 📷':''}</td><td>${fmt(r.fecha)}</td><td>${esc(cen(r.centro).n)}</td><td>${r.tipo}</td><td>${esc(r.categoria)}</td>
    <td class="r-${r.riesgo}">${r.riesgo}</td><td>${esc(r.responsable)||'<span class="counter bad">Sin asignar</span>'}</td><td>${fmt(r.fCompromiso)}</td><td>${d}</td><td>${pill(e)}</td></tr>`}).join('')}
  </tbody></table>`:`<div class="center" style="padding:30px">${tito('gracias',80)}<p class="sub">No hay reportes con estos filtros.</p></div>`;
  $('#gT').querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>detalle(tr.dataset.id));
}
function csvDe(list){
  const cols=[['id','ID'],['fecha','Fecha'],['hora','Hora'],['anio','Año'],['mes','Mes'],['empresaN','Empresa'],['centroN','Centro'],['tipo','Tipo'],['categoria','Categoría'],['riesgo','Riesgo'],['area','Lugar'],['descripcion','Descripción'],['medida','Medida inmediata'],['reportante','Reportante'],['vinculo','Vínculo'],['responsable','Responsable'],['fCompromiso','Fecha compromiso'],['accion','Acción'],['estadoV','Estado'],['fCierre','Fecha cierre'],['diasCierre','Días de cierre'],['oportuno','Cierre oportuno'],['cierreDesc','Evidencia de cierre'],['verificado','Verificado por'],['eficaz','Eficaz'],['motivoAnula','Motivo anulación'],['trazabilidad','Trazabilidad']];
  const rows=list.map(r=>({...r,empresaN:emp(r.empresa),centroN:cen(r.centro).n,estadoV:estado(r),diasCierre:r.estado==='Cerrado'?diff(r.fecha,r.fCierre):'',oportuno:r.estado==='Cerrado'?(r.fCierre<=r.fCompromiso?'Sí':'No'):'',
    trazabilidad:(r.hist||[]).map(h=>`${h.f} ${h.t}${h.u?' ('+h.u+')':''}`).join(' | ')}));
  const cell=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';

function agg(rs){const m={};
  rs.forEach(r=>{if(r.estado==='Anulado')return;const k=r.anio+'|'+r.mes+'|'+r.centro+'|'+r.empresa;
    const o=m[k]||(m[k]={anio:r.anio,mes:r.mes,centro:r.centro,empresa:r.empresa||'',n:0,actos:0,cond:0,cer:0,op:0,dias:0,efiSi:0,efiEval:0,ven:0,alto:0,cats:{},tr:{}});
    o.n++;if(r.tipo==='Acto')o.actos++;else o.cond++;
    o.cats[r.categoria]=(o.cats[r.categoria]||0)+1;const t=r.tipo+'|'+r.riesgo;o.tr[t]=(o.tr[t]||0)+1;
    if(r.estado==='Cerrado'){o.cer++;if(r.fCierre<=r.fCompromiso)o.op++;o.dias+=diff(r.fecha,r.fCierre);if(r.eficaz){o.efiEval++;if(r.eficaz==='Sí')o.efiSi++}}

  return Object.values(m)}

/* ===================== CIERRES TRIMESTRALES =====================
   1) Respaldo ZIP (Excel + JSON + fotos)  2) Resumen de indicadores en Firestore
   3) Borrado de reportes cerrados/anulados y sus fotos. Los abiertos siguen vivos. */
function trimAnterior(){const d=today();let y=+d.slice(0,4),q=Math.ceil(+d.slice(5,7)/3)-1;if(q===0){q=4;y--}return{y,q,label:`T${q}-${y}`,fin:`${y}-${QF[q-1]}`}}
function trimestres(n=6){const out=[];let {y,q}=trimAnterior();for(let i=0;i<n;i++){out.push({label:`T${q}-${y}`,fin:`${y}-${QF[q-1]}`});q--;if(q===0){q=4;y--}if(y<2026)break}return out}
async function leerCierres(){const s=await getDocs(collection(db,'cierres'));const cs=[];s.forEach(d=>cs.push({id:d.id,...d.data()}));cs.sort((a,b)=>(b.id).localeCompare(a.id));return cs}
async function avisoCierre(){
  const umbral=ST.cfg.umbral||2500;const n=(await getCountFromServer(collection(db,'reportes'))).data().count;
  const tA=trimAnterior();const cs=await leerCierres();
  const enCurso=cs.find(c=>c.estado==='en curso');
  const hecho=cs.some(c=>c.estado==='completado'&&c.fin>=tA.fin);
  let pend=false;if(!hecho){pend=(await getCountFromServer(query(collection(db,'reportes'),where('fecha','<=',tA.fin)))).data().count>0}
  const msgs=[];
  if(enCurso)msgs.push(['bad',`Hay un cierre sin terminar (${esc(enCurso.label)}). Entra a Cierres y presiona «Reanudar».`]);
  if(n>=umbral)msgs.push(['bad',`La base tiene ${n} reportes y superó el límite de ${umbral}. Haz un cierre extraordinario.`]);
  else if(n>=umbral*.8)msgs.push(['warn',`La base tiene ${n} de ${umbral} reportes (${Math.round(n/umbral*100)} %). Programa el cierre pronto.`]);
  if(pend)msgs.push(['warn',`El trimestre ${tA.label} terminó el ${fmt(tA.fin)} y su cierre está pendiente.`]);
  if(!msgs.length)return'';
  return msgs.map(([t,m])=>`<div class="card noprint" style="margin-bottom:10px;display:flex;gap:12px;align-items:center;border-left:5px solid var(--${t})">${tito('alerta',46,'')}<div style="flex:1;font-weight:600">${m}</div><a class="btn sm" href="#cierres">Ir a Cierres</a></div>`).join('');
}

async function preparar(fin,label){
  const box=$('#kBox');box.innerHTML='<div class="loading">Buscando reportes…</div>';
  try{
    const s=await getDocs(query(collection(db,'reportes'),where('estado','in',['Cerrado','Anulado'])));const rs=[];s.forEach(d=>{const r=d.data();if(r.fecha<=fin)rs.push(r)});
    rs.sort((a,b)=>a.id.localeCompare(b.id));
    const nf=rs.reduce((a,r)=>a+(r.tieneFoto?1:0)+(r.tieneFotoCierre?1:0),0);
    if(!rs.length){box.innerHTML=`<div class="center" style="padding:20px">${tito('gracias',70)}<p class="sub">No hay reportes cerrados o anulados hasta el ${fmt(fin)}. Nada que archivar.</p></div>`;return}
    const cer=rs.filter(r=>r.estado==='Cerrado').length;
    box.innerHTML=`<div class="sec-t">Cierre ${esc(label)}</div>
     <p><b>${rs.length}</b> reportes a archivar (${cer} cerrados · ${rs.length-cer} anulados) · <b>${nf}</b> fotos.</p>
     <p><b>Paso 1.</b> Descarga el respaldo y guárdalo en la carpeta HSEQ de SharePoint (retención según la tabla del CQ-P-01).</p>
     <button class="btn" id="kZ">Descargar respaldo ZIP</button> <span class="counter" id="kZs"></span>
     <div id="k2" style="opacity:.4;pointer-events:none;margin-top:14px">
      <p><b>Paso 2.</b> Archivar y liberar espacio. Esta acción borra los reportes de la base y <b>no se puede deshacer</b>; sus indicadores quedan en el dashboard.</p>
      <label class="chips"><label><input type="checkbox" id="kOk"> Confirmo que guardé el respaldo y lo abrí correctamente</label></label>
      <label>Escribe <b>${esc(label)}</b> para confirmar</label><input id="kTx" autocomplete="off">
      <div style="margin-top:10px"><button class="btn" id="kA">Archivar y liberar espacio</button> <span class="counter" id="kAs"></span></div></div>`;
    $('#kZ').onclick=async()=>{$('#kZ').disabled=true;try{await respaldo(rs,label,fin,t=>$('#kZs').textContent=t);$('#kZs').textContent='Respaldo descargado ✔';const k=$('#k2');k.style.opacity=1;k.style.pointerEvents='auto'}catch(e){console.error(e);toast('No se pudo generar el respaldo: '+errMsg(e));$('#kZ').disabled=false}};
    $('#kA').onclick=async()=>{if(!$('#kOk').checked)return toast('Confirma que guardaste el respaldo');if($('#kTx').value.trim()!==label)return toast(`Escribe exactamente ${label}`);
      $('#kA').disabled=true;try{await archivar(rs,label,fin,t=>$('#kAs').textContent=t);toast('Cierre completado. Base liberada');invalidar();vCierres()}catch(e){console.error(e);toast(errMsg(e)+'. Usa «Reanudar» en el historial',5000);vCierres()}};
  }catch(e){console.error(e);box.innerHTML=`<p class="counter bad">${esc(errMsg(e))}</p>`}
}
async function respaldo(rs,label,fin,prog){
  if(typeof JSZip==='undefined')throw new Error('No cargó la librería ZIP');
  const z=new JSZip();const plano=r=>{const o={...r};for(const k of ['creado','actualizado'])if(o[k]&&o[k].toDate)o[k]=o[k].toDate().toISOString();return o};
  z.file(`ACIS_${label}.csv`,csvDe(rs));z.file(`ACIS_${label}.json`,JSON.stringify(rs.map(plano),null,1));
  const filas=agg(rs);const cols=['anio','mes','centro','empresa','n','actos','cond','cer','op','dias','efiSi','efiEval'];
  z.file(`Resumen_indicadores_${label}.csv`,'﻿'+['Año','Mes','Centro','Empresa','Reportes','Actos','Condiciones','Cerrados','Cierre oportuno','Suma días cierre','Eficaces','Con evaluación de eficacia'].join(';')+'\n'+filas.map(f=>cols.map(c=>c==='centro'?cen(f.centro).n:c==='empresa'?emp(f.empresa):f[c]).join(';')).join('\n'));
  const fotos=[];rs.forEach(r=>{if(r.tieneFoto)fotos.push([r.id+'_r',r.id+'_reporte.jpg']);if(r.tieneFotoCierre)fotos.push([r.id+'_c',r.id+'_cierre.jpg'])});
  let i=0,falt=0;for(const [fid,name] of fotos){i++;prog(`Descargando fotos ${i}/${fotos.length}…`);
    try{const s=await getDoc(doc(db,'fotos',fid));if(s.exists()){const d=s.data().data||'';z.file('fotos/'+name,d.slice(d.indexOf(',')+1),{base64:true})}else falt++}catch(e){falt++}}
  z.file('LEEME.txt',`TITO HSEQ · Reporte ACIS — Respaldo de cierre ${label}\r\nCorte: reportes cerrados o anulados con fecha hasta ${fin}\r\nGenerado: ${new Date().toLocaleString('es-CO')} por ${ST.perfil.nombre||ST.user.email}\r\nReportes: ${rs.length} · Fotos: ${fotos.length-falt}${falt?` (${falt} no encontradas)`:''}\r\n\r\nContenido:\r\n- ACIS_${label}.csv: abrir con Excel (separador punto y coma)\r\n- ACIS_${label}.json: datos completos para restaurar o auditar\r\n- Resumen_indicadores_${label}.csv: totales por año, mes y centro\r\n- fotos/: evidencias del reporte y del cierre, nombradas por ID\r\n`);
  prog('Comprimiendo…');const blob=await z.generateAsync({type:'blob',compression:'DEFLATE'});
  download(`Respaldo_ACIS_${label}_${today()}.zip`,blob);
}
async function archivar(rs,label,fin,prog){
  const cid='C'+Date.now();const filas=agg(rs);const anios=[...new Set(filas.map(f=>f.anio))];
  const ids=rs.map(r=>r.id);const fotos=[];rs.forEach(r=>{if(r.tieneFoto)fotos.push(r.id+'_r');if(r.tieneFotoCierre)fotos.push(r.id+'_c')});
  prog('Guardando resumen de indicadores…');
  const b=writeBatch(db);
  b.set(doc(db,'resumenes',cid),{cierre:cid,label,fin,anios,filas});
  b.set(doc(db,'cierres',cid),{label,fin,fecha:today(),usuario:ST.perfil.nombre||ST.user.email,reportes:ids.length,fotos:fotos.length,ids,fotosIds:fotos,estado:'en curso',creado:serverTimestamp()});
  await b.commit();
  await borrar(cid,ids,fotos,prog);
}
async function borrar(cid,ids,fotos,prog){
  const refs=[...fotos.map(f=>doc(db,'fotos',f)),...ids.map(i=>doc(db,'reportes',i))];
  for(let i=0;i<refs.length;i+=400){prog(`Liberando espacio ${Math.min(i+400,refs.length)}/${refs.length}…`);const b=writeBatch(db);refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}
  await updateDoc(doc(db,'cierres',cid),{estado:'completado',terminado:serverTimestamp()});
}

  $('#main').querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>{const u=us.find(x=>x.uid===b.dataset.u);
    $('#mbody').innerHTML=`<div class="mhead"><h2>${esc(u.nombre)}</h2><button class="x" id="mx">×</button></div><p class="sub">${esc(u.email)}</p>
     <div class="row"><div><label>Nombre</label><input id="eN" value="${esc(u.nombre)}"></div><div><label>Rol</label><select id="eR">${['gestor','consulta','admin'].map(x=>`<option ${x===u.rol?'selected':''}>${x}</option>`).join('')}</select></div>
     <div><label>Activo</label><select id="eA"><option value="1" ${u.activo!==false?'selected':''}>Sí</option><option value="0" ${u.activo===false?'selected':''}>No (bloquear acceso)</option></select></div></div>
     <label>Centros</label>${chips(u.centros||[],'eC')}
     <div style="display:flex;gap:8px;justify-content:space-between;margin-top:16px"><button class="btn sec" id="eRst">Enviar restablecer contraseña</button><button class="btn" id="eS">Guardar</button></div>`;
    $('#modal').classList.add('on');$('#mx').onclick=()=>$('#modal').classList.remove('on');
    $('#eRst').onclick=async()=>{try{await sendPasswordResetEmail(auth,u.email);toast('Correo de restablecimiento enviado')}catch(e){toast(errMsg(e))}};
    $('#eS').onclick=async()=>{const r=$('#eR').value;try{await updateDoc(doc(db,'usuarios',u.uid),{nombre:$('#eN').value.trim(),rol:r,activo:$('#eA').value==='1',centros:r==='admin'?['*']:val('eC')});
      $('#modal').classList.remove('on');toast('Usuario actualizado');vUsuarios()}catch(e){toast(errMsg(e))}};
  });
}

/* ===================== ARRANQUE ===================== */
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')});
window.addEventListener('hashchange',route);
if(CONFIGURED){let first=true;onAuthStateChanged(auth,async u=>{ST.user=u;try{await loadPerfil(u)}catch(e){ST.perfil=null}
  if(first){first=false;route()}else if(!u||u.isAnonymous){nav()}})}else route();
</script>
</body>
</html>
